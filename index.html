<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,interactive-widget=resizes-content"><title>hollow. — notes</title><meta name="theme-color" content="#120a0d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="hollow."><style>

  :root {

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {

  .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

  .mode-toggle { display: flex; gap: 4px; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 14px; }

  .search-box { width: 100%; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; color: var(--text); font-family: var(--font-body); font-size: 15px; outline: none; margin-bottom: 12px; }

  .folder-rail { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }

  main { flex: 1; padding: 6px 20px 100px; }

  .note-list { display: flex; flex-direction: column; gap: 10px; }

  .note-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; position: relative; transition: border-color 0.15s, transform 0.1s; }
  .note-card:active { transform: scale(0.99); }
  .note-card.pinned { border-color: rgba(201,162,106,0.35); }
  .note-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
  .note-title { font-size: 16.5px; font-weight: 600; color: var(--text); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pin-star { font-size: 15px; color: var(--gold); flex-shrink: 0; line-height: 1.3; }
  .note-preview { font-size: 13.5px; color: var(--text-dim); margin: 0 0 10px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .note-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .note-date { font-family: var(--font-display); font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.02em; }
  .mini-folder { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 20px; background: rgba(122,32,53,0.15); color: var(--wine-bright); border: 1px solid rgba(122,32,53,0.3); }

  .todo-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
  .todo-check { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text-faint); display: flex; align-items: center; justify-content: center; margin-top: 1px; cursor: pointer; font-size: 12px; color: transparent; transition: all 0.15s; }

  .fab { position: fixed; right: 20px; bottom: calc(24px + var(--safe-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--wine); color: #fff; border: none; font-size: 26px; line-height: 1; cursor: pointer; box-shadow: 0 6px 20px rgba(122,32,53,0.5); display: flex; align-items: center; justify-content: center; z-index: 30; transition: transform 0.12s, background 0.15s; }
  .fab:active { transform: scale(0.92); background: var(--wine-bright); }

  .editor { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); transform: translateY(100%); transition: transform 0.25s ease; }

  .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .icon-btn { background: none; border: none; color: var(--text-dim); font-family: var(--font-display); font-size: 14px; padding: 8px 10px; cursor: pointer; border-radius: 8px; }

  .icon-btn.danger { color: #c25b6b; }

  .editor-tools { display: flex; gap: 4px; }
  .editor-body { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  .title-input { width: 100%; background: none; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 23px; font-weight: 600; margin-bottom: 14px; padding: 0; }
  .title-input::placeholder { color: var(--text-faint); font-weight: 400; }
  .body-input { width: 100%; min-height: 36vh; background: none; border: none; outline: none; resize: none; color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
  .body-input::placeholder { color: var(--text-faint); }

  .folder-edit { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .folder-edit-label { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 10px; }
  .folder-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .folder-pick-chip { font-family: var(--font-display); font-size: 12px; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-raised); color: var(--text-dim); cursor: pointer; }
  .folder-pick-chip.active { border-color: var(--wine-bright); color: var(--gold); background: rgba(122,32,53,0.2); }

  .quickadd { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); transform: translateY(100%); transition: transform 0.25s ease; }
  .quickadd.open { transform: translateY(0); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--bg-raised); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line); padding: 8px 8px calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.25s ease; max-width: 640px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--line); border-radius: 4px; margin: 8px auto 12px; }
  .sheet-item { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; text-align: left; padding: 14px 16px; font-family: var(--font-body); font-size: 15.5px; color: var(--text); cursor: pointer; border-radius: 10px; }
  .sheet-item:active { background: var(--bg-card); }
  .sheet-item.danger { color: #c25b6b; }
  .sheet-item .glyph { width: 20px; text-align: center; opacity: 0.8; }

  input[type="file"] { display: none; }

  .toast { position: fixed; bottom: calc(90px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-card); border: 1px solid var(--line); color: var(--text); padding: 10px 18px; border-radius: 10px; font-size: 13.5px; z-index: 90; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; font-family: var(--font-display); letter-spacing: 0.02em; max-width: 80%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .lock-screen.open { opacity: 1; pointer-events: auto; }
  .lock-glyph { font-size: 30px; margin-bottom: 8px; color: var(--gold); opacity: 0.8; }
  .lock-title { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 28px; }
  .pin-dots { display: flex; gap: 16px; margin-bottom: 34px; }

  .pin-dot.filled { background: var(--wine-bright); border-color: var(--wine-bright); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; }
  .pin-key { aspect-ratio: 1; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--line); color: var(--text); font-family: var(--font-body); font-size: 21px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pin-key:active { background: var(--bg-raised); }
  .pin-key.ghost { background: none; border: none; }
  .lock-back { position: absolute; top: calc(20px + var(--safe-top)); left: 20px; background: none; border: none; color: var(--text-faint); font-family: var(--font-display); font-size: 13px; cursor: pointer; }
  .lock-sub { font-family: var(--font-body); font-style: italic; font-size: 13px; color: var(--text-faint); margin-top: -18px; margin-bottom: 20px; min-height: 16px; }
  .lock-setup-hint { font-family: var(--font-body); font-style: italic; font-size: 13px; color: var(--text-faint); margin-bottom: 22px; text-align: center; max-width: 260px; }

  .archive-badge { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.05em; color: var(--gold); border: 1px solid rgba(201,162,106,0.4); border-radius: 6px; padding: 3px 8px; margin-left: 8px; }


  /* ---- additions for v3 ---- */
  .photo-strip { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .photo-thumb { position: relative; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-raised); }

  .add-photo-btn { margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; background: var(--bg-raised); border: 1px dashed var(--line); color: var(--gold); font-family: var(--font-display); font-size: 12px; letter-spacing: 0.03em; padding: 10px 14px; border-radius: 10px; cursor: pointer; }

  .todo-card { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

  .rail-hidden { display: none; }
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex-shrink:0}

.chk-row{display:flex;align-items:center;gap:10px;padding:4px 0}

.note-edit img{max-width:100%;border-radius:10px;display:block;margin:12px 0}

.todo-card,.folder-chip,.note-card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.sel-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--text-faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-right:4px}

@keyframes glowPulse{0%{box-shadow:0 0 0 0 rgba(201,162,106,0)}20%{box-shadow:0 0 18px 3px rgba(201,162,106,.55)}100%{box-shadow:0 0 0 0 rgba(201,162,106,0)}}

<div class="lock-title" id="lockTitle">ARCHIVE</div>
<div class="lock-sub" id="lockSub"></div>
<div class="lock-setup-hint" id="lockHint" style="display:none">set a 4-digit PIN to protect your archive. don't forget it, there's no reset.</div>
<div class="pin-dots" id="dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
<div class="pin-pad" id="pad"></div>
</div>
<div class="toast" id="toast"><span id="toastT"></span><button id="toastU" style="display:none">undo</button></div>
<script>(function(){
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const P={back:'<path d="M15 5l-7 7 7 7"/>',dots:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',plus:'<path d="M12 5v14M5 12h14"/>',pin:'<path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',archive:'<path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',image:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-5 4 4 3-3 4 4"/>',checksq:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',check:'<path d="M5 12l5 5 9-10"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',bksp:'<path d="M9 6h11v12H9l-5-6zM12 10l4 4M16 10l-4 4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',spark:'<path d="M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/>',down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',fplus:'<path d="M3 7h6l2 2h10v10H3zM12 12v5M9.5 14.5h5"/>',folder:'<path d="M3 7h6l2 2h10v10H3z"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',key:'<circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M16 6l3 3M18 4l2 2"/>'};
const I=(n,f)=>'<svg class="ico" viewBox="0 0 24 24"'+(f?' style="fill:currentColor"':'')+'>'+P[n]+'</svg>';

const DB=new Promise((res,rej)=>{const r=indexedDB.open('hollow',1);r.onupgradeneeded=()=>['meta','notes','imgs'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));

let S={n:[],f:[],af:[],todos:[],pin:null},mode='n',arch=0,folder=null,cur=null,tt,selOn=0,selSet=new Set();
const saveMeta=()=>dbPut('meta',{id:'m',f:S.f,af:S.af,pin:S.pin,todos:S.todos});
let utt,undoFn=null;
const toast=(m,uFn)=>{const e=$('toast'),u=$('toastU');$('toastT').textContent=m;undoFn=uFn||null;u.style.display=uFn?'':'none';e.classList.add('show');clearTimeout(tt);clearTimeout(utt);tt=setTimeout(()=>{e.classList.remove('show');undoFn=null},uFn?4200:2000)};
$('toastU').onclick=()=>{if(undoFn)undoFn();$('toast').classList.remove('show');undoFn=null;clearTimeout(tt)};
const fd=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};

function lp(el,fn){let t;const run=()=>{const n=Date.now();if(n-(lp.l||0)<800)return;lp.l=n;fn()},c=()=>clearTimeout(t);el.addEventListener('touchstart',()=>{t=setTimeout(run,500)},{passive:true});['touchend','touchmove','touchcancel'].forEach(v=>el.addEventListener(v,c));el.addEventListener('contextmenu',e=>{e.preventDefault();c();run()})}
const openSheet=()=>{$('sh').classList.add('open');$('bd').classList.add('open');pushNav('sheet')};
const closeSheet=(fromPop)=>{$('sh').classList.remove('open');$('bd').classList.remove('open');if(!fromPop)popNav()};
function act(items){if($('sh').classList.contains('open'))return;const b=$('shBody');b.innerHTML='';items.forEach(([i,l,f,d])=>{const e=document.createElement('button');e.className='sheet-item'+(d?' danger':'');e.innerHTML='<span class="glyph">'+I(i)+'</span> '+esc(l);e.onclick=()=>{closeSheet();setTimeout(f,120)};b.appendChild(e)});openSheet()}
$('bd').onclick=closeSheet;

// ---------- navigation stack (fixes back-gesture + pull-to-refresh trapping) ----------
let navStack=[];
function pushNav(tag){navStack.push(tag);history.pushState({d:navStack.length},'')}
function popNav(){if(navStack.length){navStack.pop();history.back()}}
window.addEventListener('popstate',()=>{
  if($('lock').classList.contains('open')){$('lock').classList.remove('open');navStack.pop();pinChangeMode=0;return}
  if($('pm').classList.contains('open')){$('pm').classList.remove('open');navStack.pop();return}
  if($('sh').classList.contains('open')){closeSheet(true);return}
  if($('ed').classList.contains('open')){commit(true);return}
  if(selOn){selOff(true);return}
  if(arch){arch=0;folder=null;mode='n';render();return} // archive -> home on back
});
// pull-to-refresh: while in archive, a top-of-page downward pull should exit archive, not reload
let ptStartY=null;
document.addEventListener('touchstart',e=>{if(arch&&window.scrollY<=0&&!$('ed').classList.contains('open'))ptStartY=e.touches[0].clientY;else ptStartY=null},{passive:true});
document.addEventListener('touchmove',e=>{if(ptStartY!==null&&e.touches[0].clientY-ptStartY>70){ptStartY=null;arch=0;folder=null;mode='n';render();toast('back to notes')}},{passive:true});
document.addEventListener('touchend',()=>{ptStartY=null});

function rail(){const r=$('rail');r.innerHTML='';const L=arch?S.af:S.f;const mk=(t,cls,fn,f)=>{const c=document.createElement('div');c.className='folder-chip'+cls;c.textContent=t;c.onclick=()=>{if(c.dataset.l){delete c.dataset.l;return}fn()};if(f)lp(c,()=>{c.dataset.l=1;delFolder(f)});r.appendChild(c)};mk('all',folder===null?' active':'',()=>{folder=null;render()});L.forEach(f=>mk(f,folder===f?' active':'',()=>{folder=folder===f?null:f;render()},f));mk('+ folder',' add-chip',newFolder)}
function newFolder(){const v=prompt('New folder name:');if(!v||!v.trim())return;const k=arch?'af':'f',n=v.trim();if(!S[k].includes(n))S[k].push(n);saveMeta();render()}
function delFolder(f){if(!confirm('Delete folder "'+f+'"? Notes inside stay, but leave the folder.'))return;const k=arch?'af':'f';S[k]=S[k].filter(x=>x!==f);S.n.forEach(n=>{if(n.folder===f&&!!n.arch===!!arch){n.folder=null;dbPut('notes',n)}});if(folder===f)folder=null;saveMeta();render()}

// ---------- select mode (bulk actions) ----------
function selToggle(id){if(selSet.has(id))selSet.delete(id);else selSet.add(id);if(!selSet.size)selOff();else{$('selCount').textContent=selSet.size+' selected';render()}}
function selOn_(id){selOn=1;selSet.clear();selSet.add(id);$('selBar').classList.add('on');$('selCount').textContent='1 selected';pushNav('sel');render()}
function selOff(fromPop){selOn=0;selSet.clear();$('selBar').classList.remove('on');if(!fromPop)popNav();render()}
$('selCancel').onclick=()=>selOff();
$('selDel').onclick=async()=>{
  const ids=[...selSet];const isNotes=arch||mode==='n';
  let removed;
  if(isNotes){removed=S.n.filter(n=>ids.includes(n.id));S.n=S.n.filter(n=>!ids.includes(n.id));for(const n of removed)await dbDel('notes',n.id)}
  else{removed=S.todos.filter(t=>ids.includes(t.id));S.todos=S.todos.filter(t=>!ids.includes(t.id));await saveMeta()}
  selOff();render();
  toast(removed.length+' deleted',async()=>{if(isNotes){for(const n of removed){S.n.push(n);await dbPut('notes',n)}}else{S.todos.push(...removed);await saveMeta()}render();toast('restored')});
};

function noteCard(n){
const row=document.createElement('div');row.className='card-row';
const c=document.createElement('div');c.className='note-card'+(n.pinned?' pinned':'')+(selSet.has(n.id)?' sel':'');
const ni=(n.imgs||[]).length;
const dot=selOn?'<div class="sel-dot'+(selSet.has(n.id)?' on':'')+'">'+(selSet.has(n.id)?I('check'):'')+'</div>':'';
c.innerHTML='<div class="note-top">'+dot+'<p class="note-title">'+esc(n.title||'untitled')+'</p>'+(n.pinned?'<span class="pin-star">'+I('pin',1)+'</span>':'')+'</div><p class="note-preview">'+esc(n.body||(n.checks||[]).map(x=>x.t).join(', '))+'</p><div class="note-meta"><span class="note-date">'+fd(n.updated)+'</span>'+(n.folder?'<span class="mini-folder">'+esc(n.folder)+'</span>':'')+(ni?'<span class="note-date">'+ni+' photo'+(ni>1?'s':'')+'</span>':'')+'</div>';
c.onclick=()=>selOn?selToggle(n.id):openEd(n.id);
lp(c,()=>selOn?null:noteCardMenu(n));
row.appendChild(c);$('list').appendChild(row);
if(n.id===lastSavedId){lastSavedId=null;requestAnimationFrame(()=>glowFx(c))}}

function noteCardMenu(n){
act([
  ['pin',n.pinned?'Unpin':'Pin',async()=>{n.pinned=n.pinned?0:1;await dbPut('notes',n);render()}],
  ['folder','Move to folder',()=>{const L=n.arch?S.af:S.f;if(!L.length){toast('create a folder first');return}act([['x','No folder',async()=>{n.folder=null;await dbPut('notes',n);render();toast('no folder')}],...L.map(f=>['folder',f,async()=>{n.folder=f;await dbPut('notes',n);render();toast('folder: '+f)}])])}],
  ['lock',n.arch?'Move out of archive':'Move to archive',async()=>{n.arch=n.arch?0:1;const f=n.folder;if(f){const L=n.arch?S.af:S.f;if(!L.includes(f))L.push(f);await saveMeta()}await dbPut('notes',n);render();toast(n.arch?'moved to archive':'moved out of archive')}],
  ['edit','Select multiple',()=>selOn_(n.id)],
  ['trash','Delete',async()=>{const copy=n;S.n=S.n.filter(x=>x!==copy);await dbDel('notes',copy.id);render();toast('note deleted',async()=>{S.n.push(copy);await dbPut('notes',copy);render();toast('restored')})},1]
]);
}

function todoRow(t){
const row=document.createElement('div');row.className='card-row';
const r=document.createElement('div');r.className='todo-card'+(selSet.has(t.id)?' sel':'');
const dot=selOn?'<div class="sel-dot'+(selSet.has(t.id)?' on':'')+'">'+(selSet.has(t.id)?I('check'):'')+'</div>':'';
r.innerHTML=dot+'<div class="todo-check'+(t.done?' done':'')+'">'+I('check')+'</div><div class="todo-body"><div class="todo-text'+(t.done?' done':'')+'">'+esc(t.text)+'</div><div class="todo-meta"><span class="note-date">'+fd(t.created)+'</span>'+(t.pinned?'<span class="todo-pin">'+I('pin',1)+'</span>':'')+'</div></div>';
if(selOn){r.onclick=()=>selToggle(t.id)}
else{r.querySelector('.todo-check').onclick=(e)=>{e.stopPropagation();t.done=t.done?0:1;saveMeta();if(t.done){glowFx(r);setTimeout(render,900)}else render()}}
lp(r,()=>selOn?null:todoAct(t));
row.appendChild(r);$('list').appendChild(row)}

function glowFx(el){el.classList.add('glowing');const marks=['+','+','\u2727'];for(let i=0;i<5;i++){const s=document.createElement('span');s.className='spark';s.textContent=marks[i%marks.length];s.style.left=(10+Math.random()*80)+'%';s.style.top=(20+Math.random()*40)+'%';s.style.animationDelay=(i*80)+'ms';el.appendChild(s)}setTimeout(()=>{el.classList.remove('glowing');el.querySelectorAll('.spark').forEach(s=>s.remove())},1500)}

function todoAct(t){act([['edit','Edit',()=>{const v=prompt('Edit to-do:',t.text);if(v&&v.trim()){t.text=v.trim();saveMeta();render()}}],['pin',t.pinned?'Unpin':'Pin',()=>{t.pinned=t.pinned?0:1;saveMeta();render()}],['edit','Select multiple',()=>selOn_(t.id)],['trash','Delete',()=>{const copy=t;S.todos=S.todos.filter(x=>x!==copy);saveMeta();render();toast('to-do deleted',()=>{S.todos.push(copy);saveMeta();render();toast('restored')})},1]])}
function addTodo(){if($('sh').classList.contains('open'))return;$('shBody').innerHTML='<input class="search-box" id="tIn" placeholder="what needs doing…" style="margin:8px 8px 10px;width:calc(100% - 16px)"><button class="sheet-item" id="tGo" style="justify-content:center;color:var(--gold)">Add</button>';openSheet();setTimeout(()=>$('tIn').focus(),250);const go=()=>{const v=$('tIn').value.trim();if(v){S.todos.push({id:uid(),text:v,done:0,pinned:0,created:Date.now()});saveMeta();render()}closeSheet()};$('tGo').onclick=go;$('tIn').onkeydown=e=>{if(e.key==='Enter')go()}}

function render(){
$('brand').innerHTML='hollow<span>.</span> \u2014 '+(arch?'archive':'private notes');
$('bArch').innerHTML=I('lock',arch?1:0);$('bArch').style.color=arch?'var(--wine-bright)':'var(--gold)';
$('modeToggle').style.display=arch?'none':'';
$('mNotes').classList.toggle('active',mode==='n');$('mTodos').classList.toggle('active',mode==='t');
const nm=arch||mode==='n';$('rail').style.display=nm?'':'none';if(nm)rail();
$('list').innerHTML='';
const q=$('q').value.trim().toLowerCase();let items;
if(nm){items=S.n.filter(n=>!!n.arch===!!arch&&(!folder||n.folder===folder)&&(!q||(n.title+' '+n.body+' '+(n.checks||[]).map(c=>c.t).join(' ')).toLowerCase().includes(q))).sort((a,b)=>((+b.pinned||0)-(+a.pinned||0))||(b.updated-a.updated));items.forEach(noteCard)}
else{items=S.todos.filter(t=>!q||t.text.toLowerCase().includes(q)).sort((a,b)=>((+b.pinned||0)-(+a.pinned||0))||((+a.done||0)-(+b.done||0))||(b.created-a.created));items.forEach(todoRow)}
$('empty').style.display=items.length?'none':'block';
$('emptyT').innerHTML=arch?'archive is empty.':nm?'nothing here yet.<br>tap + to leave something behind.':'no to-dos yet.<br>tap + to add one.'}
$('mNotes').onclick=()=>{mode='n';render()};$('mTodos').onclick=()=>{mode='t';render()};$('q').oninput=render;
$('fab').onclick=()=>(arch||mode==='n')?openEd():addTodo();
$('bArch').onclick=()=>{if(arch){arch=0;folder=null;render()}else openLock()};

// ---------- editor: single contenteditable field (title + body selectable together) ----------
const setFs=v=>{cur.fs=+v;$('eField').style.fontSize=v+'px';$('eChecks').style.fontSize=v+'px'};
function fieldHtml(n){const t=esc(n.title||''),b=(n.body||'').split('\n').map(esc).join('<br>');return '<div class="ttl" data-ph="untitled">'+t+'</div><div class="bd" data-ph="start writing\u2026">'+b+'</div>'}
function readField(){const f=$('eField');const ttl=f.querySelector('.ttl'),bd=f.querySelector('.bd');const title=ttl?ttl.innerText.replace(/\n+$/,''):'';let body=bd?bd.innerHTML:'';const tmp=document.createElement('div');tmp.innerHTML=body;const imgs=[...tmp.querySelectorAll('img')].map(im=>im.dataset.id);const bodyText=bd?bd.innerText.replace(/\n+$/,''):'';return{title,body:bodyText,imgOrder:imgs}}
function scrollCaret(){const sel=window.getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0).cloneRange();r.collapse(false);const rect=r.getBoundingClientRect();if(!rect||(!rect.top&&!rect.bottom))return;const pad=90;if(rect.bottom>window.innerHeight-pad){window.scrollBy({top:rect.bottom-(window.innerHeight-pad),behavior:'smooth'})}else if(rect.top<pad+60){window.scrollBy({top:rect.top-(pad+60),behavior:'smooth'})}}
$('eField').addEventListener('input',()=>{scrollCaret()});
$('eField').addEventListener('keyup',e=>{if(['Enter','ArrowDown','ArrowUp'].includes(e.key))scrollCaret()});

function openEd(id){cur=id?S.n.find(n=>n.id===id):{id:uid(),title:'',body:'',checks:[],imgs:[],folder:folder,pinned:0,arch:arch?1:0,fs:16,created:Date.now(),updated:Date.now()};cur.checks=cur.checks||[];cur.imgs=cur.imgs||[];
$('eField').innerHTML=fieldHtml(cur);setFs(cur.fs||16);
loadImgsInline();
rc();
$('ed').classList.add('open');pushNav('editor');
if(!id){const t=$('eField').querySelector('.ttl');setTimeout(()=>{t.focus()},250)}}
function closeEd(){$('ed').classList.remove('open');$('pm').classList.remove('open');cur=null;popNav()}

async function loadImgsInline(){const bd=$('eField').querySelector('.bd');if(!bd)return;for(const id of cur.imgs){if(bd.querySelector('img[data-id="'+id+'"]'))continue;const r=await dbGet('imgs',id);if(!r)continue;const w=document.createElement('span');w.className='img-del';w.contentEditable='false';w.innerHTML='<img data-id="'+id+'" src="'+r.data+'"><button aria-label="remove photo">'+I('x')+'</button>';w.querySelector('button').onclick=async()=>{cur.imgs=cur.imgs.filter(x=>x!==id);await dbDel('imgs',id);w.remove()};bd.appendChild(w)}}

let lastSavedId=null;
async function commit(fromPop){
if(!cur)return;
const f=readField();
cur.checks=cur.checks.filter(c=>c.t.trim());
const empty=!f.title&&!f.body&&!cur.checks.length&&!cur.imgs.length;
if(!empty){Object.assign(cur,{title:f.title,body:f.body,updated:Date.now()});if(!S.n.includes(cur))S.n.push(cur);await dbPut('notes',cur);lastSavedId=cur.id}
$('ed').classList.remove('open');$('pm').classList.remove('open');cur=null;if(!fromPop)popNav();
render();if(!empty)toast('saved')}

function rc(fi){const w=$('eChecks');w.innerHTML='';cur.checks.forEach((c,i)=>{const r=document.createElement('div');r.className='chk-row';r.innerHTML='<div class="todo-check'+(c.d?' done':'')+'">'+I('check')+'</div><input class="chk-in'+(c.d?' done':'')+'" value="'+esc(c.t)+'" placeholder="list item"><button class="icon-btn" aria-label="remove item">'+I('x')+'</button>';const inp=r.querySelector('input');r.querySelector('.todo-check').onclick=()=>{c.d=c.d?0:1;rc()};inp.oninput=()=>{c.t=inp.value};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();cur.checks.splice(i+1,0,{t:'',d:0});rc(i+1)}};r.querySelector('button').onclick=()=>{cur.checks.splice(i,1);rc()};w.appendChild(r);if(i===fi)setTimeout(()=>inp.focus(),0)})}

function shrink(f){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.8))};im.onerror=()=>r(null);im.src=u})}

let savedRange=null;
$('eField').addEventListener('blur',()=>{const s=window.getSelection();if(s.rangeCount)savedRange=s.getRangeAt(0).cloneRange()});

async function addFiles(fl){
const bd=$('eField').querySelector('.bd');
let sel=window.getSelection(),range;
if(sel.rangeCount&&bd.contains(sel.anchorNode))range=sel.getRangeAt(0);
else if(savedRange&&bd.contains(savedRange.startContainer))range=savedRange;
else{range=document.createRange();range.selectNodeContents(bd);range.collapse(false)}
let n=0;
for(const f of fl){const d=await shrink(f);if(!d)continue;const id=uid();await dbPut('imgs',{id,data:d});cur.imgs.push(id);
const w=document.createElement('span');w.className='img-del';w.contentEditable='false';w.innerHTML='<img data-id="'+id+'" src="'+d+'"><button aria-label="remove photo">'+I('x')+'</button>';w.querySelector('button').onclick=async()=>{cur.imgs=cur.imgs.filter(x=>x!==id);await dbDel('imgs',id);w.remove()};
range.insertNode(w);range.setStartAfter(w);range.collapse(true);n++}
if(n)toast(n+' photo'+(n>1?'s':'')+' added')}
$('fCam').onchange=$('fImg').onchange=async e=>{await addFiles(e.target.files);e.target.value=''};

$('eBack').onclick=$('eSave').onclick=commit;
$('eDel').onclick=async()=>{if(!cur||!confirm('Delete this note?'))return;const c=cur;S.n=S.n.filter(n=>n!==c);await dbDel('notes',c.id);for(const i of c.imgs)await dbDel('imgs',i);closeEd();render();toast('note deleted',async()=>{S.n.push(c);await dbPut('notes',c);render();toast('restored')})};
$('eFs').oninput=e=>setFs(e.target.value);
$('ePlus').onclick=()=>$('pm').classList.toggle('open');
$('pCam').onclick=()=>{$('pm').classList.remove('open');$('fCam').click()};
$('pImg').onclick=()=>{$('pm').classList.remove('open');$('fImg').click()};
$('pChk').onclick=()=>{$('pm').classList.remove('open');cur.checks.push({t:'',d:0});rc(cur.checks.length-1)};
document.addEventListener('click',e=>{if(!e.target.closest('#pm,#ePlus'))$('pm').classList.remove('open')});

async function exp(){const o={v:3,f:S.f,af:S.af,pin:S.pin,todos:S.todos,notes:S.n,imgs:await dbAll('imgs')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='hollow-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('exported')}
$('fImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());for(const [arr,a] of [[o.notes,0],[o.archiveNotes,1]])for(const n of arr||[])if(!S.n.some(x=>x.id===n.id)){const m=Object.assign({checks:[],imgs:[],pinned:0,fs:16,created:Date.now(),updated:Date.now()},n);if(a)m.arch=1;S.n.push(m);await dbPut('notes',m)}for(const i of o.imgs||[])await dbPut('imgs',i);for(const t of [...(o.todos||[]),...(o.archiveTodos||[])])if(!S.todos.some(x=>x.id===t.id))S.todos.push(t);for(const x of o.f||o.folders||[])if(!S.f.includes(x))S.f.push(x);for(const x of o.af||[])if(!S.af.includes(x))S.af.push(x);if(!S.pin&&o.pin)S.pin=o.pin;await saveMeta();render();toast('imported')}catch(err){toast("couldn't read that file")}e.target.value=''};
async function clr(){if(!confirm('Delete EVERYTHING, including the archive? Export first if unsure.'))return;for(const s of ['notes','imgs','meta'])await tx(s,'readwrite',o=>o.clear());S={n:[],f:[],af:[],todos:[],pin:null};arch=0;folder=null;await saveMeta();render();toast('everything cleared')}
$('bMenu').onclick=()=>act([['fplus','New folder',newFolder],['key','Change archive PIN',()=>openLock(true)],['down','Export backup (.json)',exp],['up','Import backup',()=>$('fImp').click()],['trash','Clear all data',clr,1]]);

// ---------- PIN ----------
let pb='',ps='e',pf='',pinChangeMode=0;
const dots=()=>[...$('dots').children].forEach((d,i)=>d.classList.toggle('filled',i<pb.length));
function pad(){const p=$('pad');p.innerHTML='';['1','2','3','4','5','6','7','8','9','','0','b'].forEach(k=>{const b=document.createElement('button');b.className='pin-key'+(k?'':' ghost');if(k==='b')b.innerHTML=I('bksp');else b.textContent=k;if(k)b.onclick=()=>key(k);else b.disabled=true;p.appendChild(b)})}
function key(k){if(k==='b'){pb=pb.slice(0,-1);dots();return}if(pb.length>=4)return;pb+=k;dots();if(pb.length===4)setTimeout(chk,150)}
function chk(){
if(pinChangeMode===1){ // verifying old pin before change
  if(pb===S.pin){pinChangeMode=2;pb='';ps='s1';$('lockSub').textContent='set a new PIN';dots()}
  else{toast('wrong PIN');pb='';dots()}
  return;
}
if(!S.pin||pinChangeMode===2){
  if(ps==='s1'){pf=pb;pb='';ps='s2';$('lockSub').textContent='confirm your PIN';dots()}
  else if(pb===pf){S.pin=pb;saveMeta();if(pinChangeMode===2){pinChangeMode=0;$('lock').classList.remove('open');popNav();toast('PIN updated')}else unlock()}
  else{toast("PINs didn't match");pb='';pf='';ps='s1';$('lockSub').textContent='set a new PIN';dots()}
}else if(pb===S.pin)unlock();else{toast('wrong PIN');pb='';dots()}}
function openLock(change){pb='';pf='';pinChangeMode=change?(S.pin?1:2):0;pad();dots();
if(pinChangeMode===1){ps='e';$('lockHint').style.display='none';$('lockSub').textContent='enter current PIN'}
else if(!S.pin||pinChangeMode===2){ps='s1';$('lockHint').style.display='block';$('lockSub').textContent='set a new PIN'}
else{ps='e';$('lockHint').style.display='none';$('lockSub').textContent='enter your PIN'}
$('lock').classList.add('open');pushNav('lock')}
function unlock(){$('lock').classList.remove('open');popNav();arch=1;folder=null;render();toast('archive unlocked')}
$('lockBack').onclick=()=>{$('lock').classList.remove('open');popNav();pinChangeMode=0};

async function migrate(){try{const o=JSON.parse(localStorage.getItem('hollow_data_v2')||'null');if(o){S.pin=o.pin||null;S.todos=[...(o.todos||[]),...(o.archiveTodos||[])].map(t=>({id:t.id,text:t.text,done:t.done?1:0,pinned:t.pinned?1:0,created:t.created||Date.now()}));const mk=(n,a)=>({id:n.id,title:n.title||'',body:n.body||'',checks:[],imgs:[],folder:null,pinned:n.pinned?1:0,arch:a,fs:16,created:n.created||Date.now(),updated:n.updated||Date.now()});S.n=[...(o.notes||[]).map(n=>mk(n,0)),...(o.archiveNotes||[]).map(n=>mk(n,1))];for(const n of S.n)await dbPut('notes',n)}}catch(e){}await saveMeta()}

document.querySelectorAll('[data-i]').forEach(e=>{if(!e.id||e.id!=='bArch')e.innerHTML=I(e.dataset.i)});
(async()=>{try{const m=await dbGet('meta','m');S.n=await dbAll('notes');if(m){S.f=m.f||[];S.af=m.af||[];S.pin=m.pin||null;S.todos=m.todos||[]}else await migrate();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){toast('storage unavailable')}render()})();
