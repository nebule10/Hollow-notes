<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>hollow. — notes</title>
<meta name="theme-color" content="#120a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hollow.">
<style>
  :root {
    --bg: #120a0d;
    --bg-raised: #1a1015;
    --bg-card: #1f1418;
    --line: #33222a;
    --wine: #7a2035;
    --wine-bright: #a8324f;
    --text: #ece3e6;
    --text-dim: #9c8790;
    --text-faint: #6b5860;
    --gold: #c9a26a;
    --font-display: 'Courier New', monospace;
    --font-body: Georgia, 'Times New Roman', serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse 600px 400px at 20% -5%, rgba(122,32,53,0.18), transparent 60%),
      radial-gradient(ellipse 500px 500px at 100% 10%, rgba(122,32,53,0.10), transparent 55%);
    background-attachment: fixed;
  }

  .app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  header {
    position: sticky; top: var(--safe-top); z-index: 20;
    padding: 20px 20px 12px;
    background: linear-gradient(var(--bg) 75%, transparent);
  }
  .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .brand { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.08em; color: var(--text-faint); margin: 0; }
  .brand span { color: var(--wine-bright); }
  .menu-btn { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; color: var(--text-dim); font-size: 16px; width: 34px; height: 34px; cursor: pointer; }

  .mode-toggle { display: flex; gap: 4px; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .mode-btn { flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; border: none; background: none; font-family: var(--font-body); font-size: 14.5px; color: var(--text-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .mode-btn.active { background: var(--wine); color: #fff; }

  .search-box { width: 100%; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; color: var(--text); font-family: var(--font-body); font-size: 15px; outline: none; margin-bottom: 12px; }
  .search-box::placeholder { color: var(--text-faint); }
  .search-box:focus { border-color: var(--wine); }

  .folder-rail { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .folder-rail::-webkit-scrollbar { display: none; }
  .folder-chip { flex-shrink: 0; font-family: var(--font-display); font-size: 12px; letter-spacing: 0.02em; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-raised); color: var(--text-dim); cursor: pointer; user-select: none; white-space: nowrap; transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .folder-chip.active { border-color: var(--wine-bright); color: var(--gold); background: rgba(122,32,53,0.2); }
  .folder-chip.add-chip { color: var(--gold); border-style: dashed; }

  main { flex: 1; padding: 6px 20px 100px; }
  .empty-state { text-align: center; padding: 70px 20px 40px; color: var(--text-faint); }
  .empty-state .glyph { font-size: 32px; margin-bottom: 14px; opacity: 0.5; }
  .empty-state p { font-family: var(--font-body); font-style: italic; font-size: 15px; margin: 0; line-height: 1.6; }

  .note-list { display: flex; flex-direction: column; gap: 10px; }

  .note-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; position: relative; transition: border-color 0.15s, transform 0.1s; }
  .note-card:active { transform: scale(0.99); }
  .note-card.pinned { border-color: rgba(201,162,106,0.35); }
  .note-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
  .note-title { font-size: 16.5px; font-weight: 600; color: var(--text); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pin-star { font-size: 15px; color: var(--gold); flex-shrink: 0; line-height: 1.3; }
  .note-preview { font-size: 13.5px; color: var(--text-dim); margin: 0 0 10px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .note-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .note-date { font-family: var(--font-display); font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.02em; }
  .mini-folder { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 20px; background: rgba(122,32,53,0.15); color: var(--wine-bright); border: 1px solid rgba(122,32,53,0.3); }

  .todo-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
  .todo-check { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text-faint); display: flex; align-items: center; justify-content: center; margin-top: 1px; cursor: pointer; font-size: 12px; color: transparent; transition: all 0.15s; }
  .todo-check.done { background: var(--wine); border-color: var(--wine); color: #fff; }
  .todo-body { flex: 1; min-width: 0; }
  .todo-text { font-size: 15.5px; color: var(--text); line-height: 1.4; word-break: break-word; }
  .todo-text.done { color: var(--text-faint); text-decoration: line-through; }
  .todo-meta { display: flex; gap: 8px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .todo-pin { font-size: 13px; color: var(--gold); flex-shrink: 0; }

  .fab { position: fixed; right: 20px; bottom: calc(24px + var(--safe-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--wine); color: #fff; border: none; font-size: 26px; line-height: 1; cursor: pointer; box-shadow: 0 6px 20px rgba(122,32,53,0.5); display: flex; align-items: center; justify-content: center; z-index: 30; transition: transform 0.12s, background 0.15s; }
  .fab:active { transform: scale(0.92); background: var(--wine-bright); }

  .editor { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); transform: translateY(100%); transition: transform 0.25s ease; }
  .editor.open { transform: translateY(0); }
  .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .icon-btn { background: none; border: none; color: var(--text-dim); font-family: var(--font-display); font-size: 14px; padding: 8px 10px; cursor: pointer; border-radius: 8px; }
  .icon-btn:active { background: var(--bg-raised); }
  .icon-btn.danger { color: #c25b6b; }
  .icon-btn.save { color: var(--gold); font-weight: bold; }
  .editor-tools { display: flex; gap: 4px; }
  .editor-body { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  .title-input { width: 100%; background: none; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 23px; font-weight: 600; margin-bottom: 14px; padding: 0; }
  .title-input::placeholder { color: var(--text-faint); font-weight: 400; }
  .body-input { width: 100%; min-height: 36vh; background: none; border: none; outline: none; resize: none; color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
  .body-input::placeholder { color: var(--text-faint); }

  .folder-edit { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .folder-edit-label { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 10px; }
  .folder-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .folder-pick-chip { font-family: var(--font-display); font-size: 12px; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-raised); color: var(--text-dim); cursor: pointer; }
  .folder-pick-chip.active { border-color: var(--wine-bright); color: var(--gold); background: rgba(122,32,53,0.2); }

  .quickadd { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); transform: translateY(100%); transition: transform 0.25s ease; }
  .quickadd.open { transform: translateY(0); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--bg-raised); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line); padding: 8px 8px calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.25s ease; max-width: 640px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--line); border-radius: 4px; margin: 8px auto 12px; }
  .sheet-item { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; text-align: left; padding: 14px 16px; font-family: var(--font-body); font-size: 15.5px; color: var(--text); cursor: pointer; border-radius: 10px; }
  .sheet-item:active { background: var(--bg-card); }
  .sheet-item.danger { color: #c25b6b; }
  .sheet-item .glyph { width: 20px; text-align: center; opacity: 0.8; }

  input[type="file"] { display: none; }

  .toast { position: fixed; bottom: calc(90px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-card); border: 1px solid var(--line); color: var(--text); padding: 10px 18px; border-radius: 10px; font-size: 13.5px; z-index: 90; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; font-family: var(--font-display); letter-spacing: 0.02em; max-width: 80%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .lock-screen.open { opacity: 1; pointer-events: auto; }
  .lock-glyph { font-size: 30px; margin-bottom: 8px; color: var(--gold); opacity: 0.8; }
  .lock-title { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 28px; }
  .pin-dots { display: flex; gap: 16px; margin-bottom: 34px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--text-faint); transition: background 0.1s, border-color 0.1s; }
  .pin-dot.filled { background: var(--wine-bright); border-color: var(--wine-bright); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; }
  .pin-key { aspect-ratio: 1; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--line); color: var(--text); font-family: var(--font-body); font-size: 21px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pin-key:active { background: var(--bg-raised); }
  .pin-key.ghost { background: none; border: none; }
  .lock-back { position: absolute; top: calc(20px + var(--safe-top)); left: 20px; background: none; border: none; color: var(--text-faint); font-family: var(--font-display); font-size: 13px; cursor: pointer; }
  .lock-sub { font-family: var(--font-body); font-style: italic; font-size: 13px; color: var(--text-faint); margin-top: -18px; margin-bottom: 20px; min-height: 16px; }
  .lock-setup-hint { font-family: var(--font-body); font-style: italic; font-size: 13px; color: var(--text-faint); margin-bottom: 22px; text-align: center; max-width: 260px; }

  .archive-badge { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.05em; color: var(--gold); border: 1px solid rgba(201,162,106,0.4); border-radius: 6px; padding: 3px 8px; margin-left: 8px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand-row">
      <p class="brand" id="brandLabel">hollow<span>.</span> — private notes</p>
      <button class="menu-btn" id="fabMenu">⋯</button>
    </div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="modeNotesBtn">✎ Notes</button>
      <button class="mode-btn" id="modeTodosBtn">☑ To-dos</button>
    </div>

    <input class="search-box" id="searchBox" type="text" placeholder="search…" autocomplete="off">
    <div class="folder-rail" id="folderRail"></div>
  </header>

  <main>
    <div class="note-list" id="itemList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="glyph">✧</div>
      <p id="emptyText">nothing here yet.<br>tap + to leave something behind.</p>
    </div>
  </main>
</div>

<button class="fab" id="fabAdd">+</button>

<div class="editor" id="editor">
  <div class="editor-header">
    <button class="icon-btn" id="editorClose">← back</button>
    <div class="editor-tools">
      <button class="icon-btn" id="editorPin">☆ pin</button>
      <button class="icon-btn danger" id="editorDelete">delete</button>
      <button class="icon-btn save" id="editorSave">save</button>
    </div>
  </div>
  <div class="editor-body">
    <input class="title-input" id="titleInput" placeholder="untitled">
    <textarea class="body-input" id="bodyInput" placeholder="start writing…"></textarea>
    <div class="folder-edit">
      <div class="folder-edit-label">FOLDER</div>
      <div class="folder-picker" id="folderPicker"></div>
    </div>
  </div>
</div>

<div class="quickadd" id="quickadd">
  <div class="editor-header">
    <button class="icon-btn" id="qaClose">← back</button>
    <button class="icon-btn save" id="qaSave">save</button>
  </div>
  <div class="editor-body">
    <input class="title-input" id="qaText" placeholder="what needs doing…" style="font-size:19px;">
    <div class="folder-edit" style="margin-top:18px;">
      <div class="folder-edit-label">FOLDER</div>
      <div class="folder-picker" id="qaFolderPicker"></div>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-item" id="newFolderBtn"><span class="glyph">+</span> new folder</button>
  <button class="sheet-item" id="archiveBtn"><span class="glyph">🔒</span> <span id="archiveLabel">open archive</span></button>
  <button class="sheet-item" id="exportBtn"><span class="glyph">⇩</span> export everything (.json)</button>
  <button class="sheet-item" id="importBtn"><span class="glyph">⇧</span> import from file</button>
  <button class="sheet-item danger" id="clearBtn"><span class="glyph">✕</span> clear all data</button>
</div>
<input type="file" id="fileInput" accept="application/json">

<div class="lock-screen" id="lockScreen">
  <button class="lock-back" id="lockBack">← cancel</button>
  <div class="lock-glyph">🔒</div>
  <div class="lock-title" id="lockTitle">ARCHIVE</div>
  <div class="lock-sub" id="lockSub"></div>
  <div class="lock-setup-hint" id="lockSetupHint" style="display:none;">set a 4-digit PIN to protect your archive. don't forget it — there's no reset.</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="pin-pad" id="pinPad"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORE_KEY = 'hollow_data_v2';
  const DEFAULT_FOLDERS = ['Ideas', 'Random', 'Uni'];

  let data = { folders: [], notes: [], todos: [], archiveNotes: [], archiveTodos: [], pin: null };
  let mode = 'notes';
  let inArchive = false;
  let activeFolder = null;
  let activeItem = null;
  let activeItemFolder = null;
  let pinBuffer = '';
  let pinStage = 'enter';
  let pinFirstEntry = '';

  const $ = id => document.getElementById(id);
  const itemList = $('itemList'), emptyState = $('emptyState'), emptyText = $('emptyText'), folderRail = $('folderRail');
  const searchBox = $('searchBox');
  const editor = $('editor'), titleInput = $('titleInput'), bodyInput = $('bodyInput'), folderPicker = $('folderPicker');
  const quickadd = $('quickadd'), qaText = $('qaText'), qaFolderPicker = $('qaFolderPicker');
  const sheet = $('sheet'), sheetBackdrop = $('sheetBackdrop');
  const toastEl = $('toast');
  const lockScreen = $('lockScreen'), pinDots = $('pinDots'), pinPad = $('pinPad'), lockSub = $('lockSub'), lockSetupHint = $('lockSetupHint');

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        data = Object.assign({ folders: [], notes: [], todos: [], archiveNotes: [], archiveTodos: [], pin: null }, JSON.parse(raw));
      } else {
        // migrate from old v1 tag-based storage if present
        const old = localStorage.getItem('hollow_notes_v1');
        if (old) {
          try {
            const oldNotes = JSON.parse(old);
            const folderSet = new Set();
            const migrated = oldNotes.map(n => {
              const folder = (n.tags && n.tags[0]) ? n.tags[0] : null;
              if (folder) folderSet.add(folder);
              return { id: n.id, title: n.title, body: n.body, folder, pinned: !!n.pinned, created: n.created || Date.now(), updated: n.updated || Date.now() };
            });
            data.notes = migrated;
            data.folders = [...folderSet];
            showToast('old notes migrated ✓');
          } catch(e2) {}
        }
      }
      if (!data.folders || !data.folders.length) data.folders = [...DEFAULT_FOLDERS];
    } catch(e) { data = { folders: [...DEFAULT_FOLDERS], notes: [], todos: [], archiveNotes: [], archiveTodos: [], pin: null }; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
    catch(e) { showToast('storage full — export & clear some data'); }
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function fmtDate(ts) {
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    return d.toLocaleDateString([], {month:'short', day:'numeric'});
  }
  function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function curNotes() { return inArchive ? data.archiveNotes : data.notes; }
  function curTodos() { return inArchive ? data.archiveTodos : data.todos; }

  function renderBrand() {
    $('brandLabel').innerHTML = inArchive
      ? `hollow<span style="color:var(--wine-bright)">.</span> — archive <span class="archive-badge">LOCKED SPACE</span>`
      : `hollow<span style="color:var(--wine-bright)">.</span> — private notes`;
  }

  function renderFolderRail() {
    folderRail.innerHTML = '';
    const allChip = document.createElement('div');
    allChip.className = 'folder-chip' + (activeFolder === null ? ' active' : '');
    allChip.textContent = 'all';
    allChip.onclick = () => { activeFolder = null; render(); };
    folderRail.appendChild(allChip);

    data.folders.forEach(f => {
      const chip = document.createElement('div');
      chip.className = 'folder-chip' + (activeFolder === f ? ' active' : '');
      chip.textContent = f;
      chip.onclick = () => { activeFolder = (activeFolder === f ? null : f); render(); };
      let pressTimer;
      chip.addEventListener('touchstart', () => { pressTimer = setTimeout(() => maybeDeleteFolder(f), 600); });
      chip.addEventListener('touchend', () => clearTimeout(pressTimer));
      folderRail.appendChild(chip);
    });

    const addChip = document.createElement('div');
    addChip.className = 'folder-chip add-chip';
    addChip.textContent = '+ folder';
    addChip.onclick = promptNewFolder;
    folderRail.appendChild(addChip);
  }

  function maybeDeleteFolder(f) {
    const usedBy = [...curNotes(), ...curTodos()].filter(i => i.folder === f).length;
    const msg = usedBy > 0 ? `Delete folder "${f}"? ${usedBy} item(s) inside will move to "no folder".` : `Delete empty folder "${f}"?`;
    if (confirm(msg)) {
      data.folders = data.folders.filter(x => x !== f);
      [...data.notes, ...data.todos, ...data.archiveNotes, ...data.archiveTodos].forEach(i => { if (i.folder === f) i.folder = null; });
      if (activeFolder === f) activeFolder = null;
      save(); render();
      showToast('folder deleted');
    }
  }

  function promptNewFolder() {
    const name = prompt('New folder name:');
    if (name && name.trim()) {
      const clean = name.trim();
      if (!data.folders.includes(clean)) data.folders.push(clean);
      save(); render();
    }
  }

  function render() {
    renderBrand();
    renderFolderRail();
    const q = searchBox.value.trim().toLowerCase();
    itemList.innerHTML = '';

    if (mode === 'notes') {
      let list = curNotes().filter(n => {
        if (activeFolder && n.folder !== activeFolder) return false;
        if (q && !(n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q))) return false;
        return true;
      });
      list.sort((a,b) => (b.pinned - a.pinned) || (b.updated - a.updated));
      emptyState.style.display = list.length ? 'none' : 'block';
      emptyText.innerHTML = inArchive ? 'archive is empty.' : 'nothing here yet.<br>tap + to leave something behind.';

      list.forEach(n => {
        const card = document.createElement('div');
        card.className = 'note-card' + (n.pinned ? ' pinned' : '');
        card.innerHTML = `
          <div class="note-top">
            <p class="note-title">${escapeHtml(n.title || 'untitled')}</p>
            ${n.pinned ? '<span class="pin-star">★</span>' : ''}
          </div>
          <p class="note-preview">${escapeHtml(n.body || '')}</p>
          <div class="note-meta">
            <span class="note-date">${fmtDate(n.updated)}</span>
            ${n.folder ? `<span class="mini-folder">${escapeHtml(n.folder)}</span>` : ''}
          </div>`;
        card.onclick = () => openNoteEditor(n.id);
        itemList.appendChild(card);
      });
    } else {
      let list = curTodos().filter(t => {
        if (activeFolder && t.folder !== activeFolder) return false;
        if (q && !t.text.toLowerCase().includes(q)) return false;
        return true;
      });
      list.sort((a,b) => (b.pinned - a.pinned) || (a.done - b.done) || (b.created - a.created));
      emptyState.style.display = list.length ? 'none' : 'block';
      emptyText.innerHTML = inArchive ? 'archive is empty.' : 'no to-dos yet.<br>tap + to add one.';

      list.forEach(t => {
        const row = document.createElement('div');
        row.className = 'todo-card';
        row.innerHTML = `
          <div class="todo-check ${t.done ? 'done' : ''}">${t.done ? '✓' : ''}</div>
          <div class="todo-body">
            <div class="todo-text ${t.done ? 'done' : ''}">${escapeHtml(t.text)}</div>
            <div class="todo-meta">
              <span class="note-date">${fmtDate(t.created)}</span>
              ${t.folder ? `<span class="mini-folder">${escapeHtml(t.folder)}</span>` : ''}
              ${t.pinned ? '<span class="todo-pin">★</span>' : ''}
            </div>
          </div>`;
        row.querySelector('.todo-check').onclick = (e) => { e.stopPropagation(); t.done = !t.done; save(); render(); };
        row.onclick = () => openTodoOptions(t);
        itemList.appendChild(row);
      });
    }
  }

  function openTodoOptions(t) {
    const action = prompt(`"${t.text}"\n\nType: edit / pin / unpin / delete`, 'edit');
    if (!action) return;
    const a = action.trim().toLowerCase();
    if (a === 'edit') {
      const newText = prompt('Edit to-do:', t.text);
      if (newText && newText.trim()) { t.text = newText.trim(); save(); render(); }
    } else if (a === 'pin') { t.pinned = true; save(); render(); }
    else if (a === 'unpin') { t.pinned = false; save(); render(); }
    else if (a === 'delete') {
      const list = inArchive ? data.archiveTodos : data.todos;
      const idx = list.findIndex(x => x.id === t.id);
      if (idx > -1) list.splice(idx, 1);
      save(); render(); showToast('to-do deleted');
    }
  }

  $('modeNotesBtn').onclick = () => { mode = 'notes'; $('modeNotesBtn').classList.add('active'); $('modeTodosBtn').classList.remove('active'); render(); };
  $('modeTodosBtn').onclick = () => { mode = 'todos'; $('modeTodosBtn').classList.add('active'); $('modeNotesBtn').classList.remove('active'); render(); };
  searchBox.addEventListener('input', render);

  function renderFolderPicker(container, selected, onPick) {
    container.innerHTML = '';
    const noneChip = document.createElement('div');
    noneChip.className = 'folder-pick-chip' + (!selected ? ' active' : '');
    noneChip.textContent = 'none';
    noneChip.onclick = () => onPick(null);
    container.appendChild(noneChip);
    data.folders.forEach(f => {
      const chip = document.createElement('div');
      chip.className = 'folder-pick-chip' + (selected === f ? ' active' : '');
      chip.textContent = f;
      chip.onclick = () => onPick(f);
      container.appendChild(chip);
    });
  }

  function noteFolderPick(f) { activeItemFolder = f; renderFolderPicker(folderPicker, activeItemFolder, noteFolderPick); }

  function openNoteEditor(id) {
    const list = curNotes();
    activeItem = id ? list.find(n => n.id === id) : { id: uid(), title:'', body:'', folder: activeFolder, pinned:false, created: Date.now(), updated: Date.now() };
    activeItemFolder = activeItem.folder || null;
    titleInput.value = activeItem.title || '';
    bodyInput.value = activeItem.body || '';
    renderFolderPicker(folderPicker, activeItemFolder, noteFolderPick);
    updatePinBtn();
    editor.classList.add('open');
    setTimeout(() => titleInput.focus(), 200);
  }
  function updatePinBtn() { $('editorPin').textContent = activeItem.pinned ? '★ pinned' : '☆ pin'; }
  function closeNoteEditor() { editor.classList.remove('open'); activeItem = null; }

  function commitNote() {
    if (!activeItem) return;
    const title = titleInput.value.trim(), body = bodyInput.value.trim();
    if (!title && !body) { closeNoteEditor(); return; }
    activeItem.title = title; activeItem.body = body; activeItem.folder = activeItemFolder; activeItem.updated = Date.now();
    const list = curNotes();
    if (!list.find(n => n.id === activeItem.id)) list.push(activeItem);
    save(); render(); closeNoteEditor();
    showToast('saved');
  }

  $('editorClose').onclick = commitNote;
  $('editorSave').onclick = commitNote;
  $('editorPin').onclick = () => { activeItem.pinned = !activeItem.pinned; updatePinBtn(); };
  $('editorDelete').onclick = () => {
    if (!activeItem) return;
    const list = inArchive ? data.archiveNotes : data.notes;
    const idx = list.findIndex(n => n.id === activeItem.id);
    if (idx > -1) list.splice(idx, 1);
    save(); render(); closeNoteEditor();
    showToast('note deleted');
  };

  let qaFolder = null;
  function qaFolderPick(f) { qaFolder = f; renderFolderPicker(qaFolderPicker, qaFolder, qaFolderPick); }
  function openQuickAdd() {
    qaText.value = '';
    qaFolder = activeFolder;
    renderFolderPicker(qaFolderPicker, qaFolder, qaFolderPick);
    quickadd.classList.add('open');
    setTimeout(() => qaText.focus(), 200);
  }
  $('qaClose').onclick = () => quickadd.classList.remove('open');
  $('qaSave').onclick = () => {
    const text = qaText.value.trim();
    if (!text) { quickadd.classList.remove('open'); return; }
    const list = curTodos();
    list.push({ id: uid(), text, folder: qaFolder, done: false, pinned:false, created: Date.now() });
    save(); render();
    quickadd.classList.remove('open');
    showToast('to-do added');
  };

  $('fabAdd').onclick = () => { if (mode === 'notes') openNoteEditor(null); else openQuickAdd(); };

  $('fabMenu').onclick = () => { sheet.classList.add('open'); sheetBackdrop.classList.add('open'); $('archiveLabel').textContent = inArchive ? 'leave archive' : 'open archive'; };
  sheetBackdrop.onclick = () => { sheet.classList.remove('open'); sheetBackdrop.classList.remove('open'); };
  $('newFolderBtn').onclick = () => { sheetBackdrop.click(); promptNewFolder(); };

  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `hollow-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    sheetBackdrop.click(); showToast('exported ✓');
  };
  $('importBtn').onclick = () => $('fileInput').click();
  $('fileInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (imported.notes) imported.notes.forEach(n => { if (!data.notes.find(x=>x.id===n.id)) data.notes.push(n); });
        if (imported.todos) imported.todos.forEach(t => { if (!data.todos.find(x=>x.id===t.id)) data.todos.push(t); });
        if (imported.archiveNotes) imported.archiveNotes.forEach(n => { if (!data.archiveNotes.find(x=>x.id===n.id)) data.archiveNotes.push(n); });
        if (imported.archiveTodos) imported.archiveTodos.forEach(t => { if (!data.archiveTodos.find(x=>x.id===t.id)) data.archiveTodos.push(t); });
        if (imported.folders) imported.folders.forEach(f => { if (!data.folders.includes(f)) data.folders.push(f); });
        save(); render(); showToast('imported ✓');
      } catch(err) { showToast("couldn't read that file"); }
      sheetBackdrop.click(); e.target.value = '';
    };
    reader.readAsText(file);
  });
  $('clearBtn').onclick = () => {
    sheetBackdrop.click();
    if (confirm("Delete EVERYTHING — notes, todos, archive, folders? Export first if you're not sure. Can't be undone.")) {
      data = { folders: [...DEFAULT_FOLDERS], notes: [], todos: [], archiveNotes: [], archiveTodos: [], pin: null };
      activeFolder = null; inArchive = false;
      save(); render(); showToast('everything cleared');
    }
  };

  function buildPinPad() {
    pinPad.innerHTML = '';
    const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    keys.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'pin-key' + (k === '' ? ' ghost' : '');
      btn.textContent = k;
      if (k !== '') btn.onclick = () => handlePinKey(k);
      else btn.disabled = true;
      pinPad.appendChild(btn);
    });
  }
  function renderPinDots() { [...pinDots.children].forEach((d,i) => d.classList.toggle('filled', i < pinBuffer.length)); }
  function handlePinKey(k) {
    if (k === '⌫') { pinBuffer = pinBuffer.slice(0,-1); renderPinDots(); return; }
    if (pinBuffer.length >= 4) return;
    pinBuffer += k;
    renderPinDots();
    if (pinBuffer.length === 4) setTimeout(evaluatePin, 150);
  }
  function evaluatePin() {
    if (!data.pin) {
      if (pinStage === 'setup1') {
        pinFirstEntry = pinBuffer; pinBuffer = ''; pinStage = 'setup2';
        lockSub.textContent = 'confirm your PIN'; renderPinDots();
        return;
      } else if (pinStage === 'setup2') {
        if (pinBuffer === pinFirstEntry) {
          data.pin = pinBuffer; save();
          showToast('PIN set ✓');
          unlockArchive();
        } else {
          showToast("PINs didn't match — try again");
          pinBuffer = ''; pinFirstEntry = ''; pinStage = 'setup1';
          lockSub.textContent = 'set a new PIN'; renderPinDots();
        }
        return;
      }
    } else {
      if (pinBuffer === data.pin) unlockArchive();
      else { showToast('wrong PIN'); pinBuffer = ''; renderPinDots(); }
    }
  }
  function openLockScreen() {
    pinBuffer = ''; pinFirstEntry = '';
    buildPinPad(); renderPinDots();
    if (!data.pin) { pinStage = 'setup1'; lockSetupHint.style.display = 'block'; lockSub.textContent = 'set a new PIN'; }
    else { lockSetupHint.style.display = 'none'; lockSub.textContent = 'enter your PIN'; }
    lockScreen.classList.add('open');
  }
  function unlockArchive() {
    lockScreen.classList.remove('open');
    inArchive = true; mode = 'notes';
    $('modeNotesBtn').classList.add('active'); $('modeTodosBtn').classList.remove('active');
    activeFolder = null;
    render();
    showToast('archive unlocked');
  }
  $('archiveBtn').onclick = () => {
    sheetBackdrop.click();
    if (inArchive) { inArchive = false; activeFolder = null; render(); showToast('back to main notes'); }
    else openLockScreen();
  };
  $('lockBack').onclick = () => lockScreen.classList.remove('open');

      description: "A private, offline notes app that lives only on your device.",
      start_url: ".",
      id: ".",

    const swLines = [
      "const CACHE = 'hollow-notes-v2';",
      "self.addEventListener('install', e => { self.skipWaiting(); });",
      "self.addEventListener('activate', e => { self.clients.claim(); });",
      "self.addEventListener('fetch', e => {",
      "  if (e.request.method !== 'GET') return;",
      "  e.respondWith(",
      "    caches.open(CACHE).then(cache =>",
      "      cache.match(e.request).then(cached => {",
      "        const fetchPromise = fetch(e.request).then(res => {",
      "          if (res && res.status === 200) cache.put(e.request, res.clone());",
      "          return res;",
      "        }).catch(() => cached);",
      "        return cached || fetchPromise;",
      "      })",
      "    )",
      "  );",
      "});"
    ];

    const swURL = URL.createObjectURL(swBlob);
