<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,interactive-widget=resizes-content"><title>hollow. — notes</title><meta name="theme-color" content="#120a0d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="hollow."><style>

  :root {

  .app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  }
  .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

  .brand span { color: var(--wine-bright); }
  .menu-btn { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; color: var(--text-dim); font-size: 16px; width: 34px; height: 34px; cursor: pointer; }

  .fab { position: fixed; right: 20px; bottom: calc(24px + var(--safe-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--wine); color: #fff; border: none; font-size: 26px; line-height: 1; cursor: pointer; box-shadow: 0 6px 20px rgba(122,32,53,0.5); display: flex; align-items: center; justify-content: center; z-index: 30; transition: transform 0.12s, background 0.15s; }

  .editor-tools { display: flex; gap: 4px; }
  .editor-body { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  .title-input { width: 100%; background: none; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 23px; font-weight: 600; margin-bottom: 14px; padding: 0; }
  .title-input::placeholder { color: var(--text-faint); font-weight: 400; }
  .body-input { width: 100%; min-height: 36vh; background: none; border: none; outline: none; resize: none; color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
  .body-input::placeholder { color: var(--text-faint); }

  .folder-edit { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }

  .folder-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .folder-pick-chip { font-family: var(--font-display); font-size: 12px; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-raised); color: var(--text-dim); cursor: pointer; }
  .folder-pick-chip.active { border-color: var(--wine-bright); color: var(--gold); background: rgba(122,32,53,0.2); }

  .quickadd { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); transform: translateY(100%); transition: transform 0.25s ease; }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s; }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--bg-raised); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line); padding: 8px 8px calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.25s ease; max-width: 640px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--line); border-radius: 4px; margin: 8px auto 12px; }
  .sheet-item { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; text-align: left; padding: 14px 16px; font-family: var(--font-body); font-size: 15.5px; color: var(--text); cursor: pointer; border-radius: 10px; }

  input[type="file"] { display: none; }

  .lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); opacity: 0; pointer-events: none; transition: opacity 0.2s; }

  .lock-glyph { font-size: 30px; margin-bottom: 8px; color: var(--gold); opacity: 0.8; }
  .lock-title { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 28px; }

  .archive-badge { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.05em; color: var(--gold); border: 1px solid rgba(201,162,106,0.4); border-radius: 6px; padding: 3px 8px; margin-left: 8px; }


  /* ---- additions for v3 ---- */
  .photo-strip { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .photo-thumb { position: relative; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-raised); }

  .card-thumbs .more { width: 46px; height: 46px; border-radius: 7px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 11px; color: var(--text-faint); }

.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex-shrink:0}

const DB=new Promise((res,rej)=>{const r=indexedDB.open('hollow',1);r.onupgradeneeded=()=>['meta','notes','imgs'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));

let S={n:[],f:[],af:[],todos:[],pin:null},mode='n',arch=0,folder=null,cur=null,tt;
const saveMeta=()=>dbPut('meta',{id:'m',f:S.f,af:S.af,pin:S.pin,todos:S.todos});
const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2000)};
const fd=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};

function lp(el,fn){let t;const run=()=>{const n=Date.now();if(n-(lp.l||0)<800)return;lp.l=n;fn()},c=()=>clearTimeout(t);el.addEventListener('touchstart',()=>{t=setTimeout(run,500)},{passive:true});['touchend','touchmove','touchcancel'].forEach(v=>el.addEventListener(v,c));el.addEventListener('contextmenu',e=>{e.preventDefault();c();run()})}
const openSheet=()=>{$('sh').classList.add('open');$('bd').classList.add('open')};
const closeSheet=()=>{$('sh').classList.remove('open');$('bd').classList.remove('open')};
function act(items){if($('sh').classList.contains('open'))return;const b=$('shBody');b.innerHTML='';items.forEach(([i,l,f,d])=>{const e=document.createElement('button');e.className='sheet-item'+(d?' danger':'');e.innerHTML='<span class="glyph">'+I(i)+'</span> '+esc(l);e.onclick=()=>{closeSheet();f()};b.appendChild(e)});openSheet()}
$('bd').onclick=closeSheet;

function rail(){const r=$('rail');r.innerHTML='';const L=arch?S.af:S.f;const mk=(t,cls,fn,f)=>{const c=document.createElement('div');c.className='folder-chip'+cls;c.textContent=t;c.onclick=()=>{if(c.dataset.l){delete c.dataset.l;return}fn()};if(f)lp(c,()=>{c.dataset.l=1;delFolder(f)});r.appendChild(c)};mk('all',folder===null?' active':'',()=>{folder=null;render()});L.forEach(f=>mk(f,folder===f?' active':'',()=>{folder=folder===f?null:f;render()},f));mk('+ folder',' add-chip',newFolder)}
function newFolder(){const v=prompt('New folder name:');if(!v||!v.trim())return;const k=arch?'af':'f',n=v.trim();if(!S[k].includes(n))S[k].push(n);saveMeta();render()}
function delFolder(f){if(!confirm('Delete folder "'+f+'"? Notes inside stay, but leave the folder.'))return;const k=arch?'af':'f';S[k]=S[k].filter(x=>x!==f);S.n.forEach(n=>{if(n.folder===f&&!!n.arch===!!arch){n.folder=null;dbPut('notes',n)}});if(folder===f)folder=null;saveMeta();render()}

function noteCard(n){const c=document.createElement('div');c.className='note-card'+(n.pinned?' pinned':'');const ni=(n.imgs||[]).length;c.innerHTML='<div class="note-top"><p class="note-title">'+esc(n.title||'untitled')+'</p>'+(n.pinned?'<span class="pin-star">'+I('pin',1)+'</span>':'')+'</div><p class="note-preview">'+esc(n.body||(n.checks||[]).map(x=>x.t).join(', '))+'</p><div class="note-meta"><span class="note-date">'+fd(n.updated)+'</span>'+(n.folder?'<span class="mini-folder">'+esc(n.folder)+'</span>':'')+(ni?'<span class="note-date">'+ni+' photo'+(ni>1?'s':'')+'</span>':'')+'</div>';c.onclick=()=>openEd(n.id);$('list').appendChild(c)}
function todoRow(t){const r=document.createElement('div');r.className='todo-card';r.innerHTML='<div class="todo-check'+(t.done?' done':'')+'">'+I('check')+'</div><div class="todo-body"><div class="todo-text'+(t.done?' done':'')+'">'+esc(t.text)+'</div><div class="todo-meta"><span class="note-date">'+fd(t.created)+'</span>'+(t.pinned?'<span class="todo-pin">'+I('pin',1)+'</span>':'')+'</div></div>';r.querySelector('.todo-check').onclick=()=>{t.done=t.done?0:1;saveMeta();render()};lp(r,()=>todoAct(t));$('list').appendChild(r)}
function todoAct(t){act([['edit','Edit',()=>{const v=prompt('Edit to-do:',t.text);if(v&&v.trim()){t.text=v.trim();saveMeta();render()}}],['pin',t.pinned?'Unpin':'Pin',()=>{t.pinned=t.pinned?0:1;saveMeta();render()}],['trash','Delete',()=>{S.todos=S.todos.filter(x=>x!==t);saveMeta();render()},1]])}
function addTodo(){if($('sh').classList.contains('open'))return;$('shBody').innerHTML='<input class="search-box" id="tIn" placeholder="what needs doing…" style="margin:8px 8px 10px;width:calc(100% - 16px)"><button class="sheet-item" id="tGo" style="justify-content:center;color:var(--gold)">Add</button>';openSheet();setTimeout(()=>$('tIn').focus(),250);const go=()=>{const v=$('tIn').value.trim();if(v){S.todos.push({id:uid(),text:v,done:0,pinned:0,created:Date.now()});saveMeta();render()}closeSheet()};$('tGo').onclick=go;$('tIn').onkeydown=e=>{if(e.key==='Enter')go()}}

function render(){
$('brand').innerHTML='hollow<span>.</span> — '+(arch?'archive':'private notes');
$('modeToggle').style.display=arch?'none':'';
$('mNotes').classList.toggle('active',mode==='n');$('mTodos').classList.toggle('active',mode==='t');
const nm=arch||mode==='n';$('rail').style.display=nm?'':'none';if(nm)rail();
const q=$('q').value.trim().toLowerCase();$('list').innerHTML='';let items;
if(nm){items=S.n.filter(n=>!!n.arch===!!arch&&(!folder||n.folder===folder)&&(!q||(n.title+' '+n.body+' '+(n.checks||[]).map(c=>c.t).join(' ')).toLowerCase().includes(q))).sort((a,b)=>((+b.pinned||0)-(+a.pinned||0))||(b.updated-a.updated));items.forEach(noteCard)}
else{items=S.todos.filter(t=>!q||t.text.toLowerCase().includes(q)).sort((a,b)=>((+b.pinned||0)-(+a.pinned||0))||((+a.done||0)-(+b.done||0))||(b.created-a.created));items.forEach(todoRow)}
$('empty').style.display=items.length?'none':'block';
$('emptyT').innerHTML=arch?'archive is empty.':nm?'nothing here yet.<br>tap + to leave something behind.':'no to-dos yet.<br>tap + to add one.'}
$('mNotes').onclick=()=>{mode='n';render()};$('mTodos').onclick=()=>{mode='t';render()};$('q').oninput=render;
$('fab').onclick=()=>(arch||mode==='n')?openEd():addTodo();

const setFs=v=>{cur.fs=+v;$('eBody').style.fontSize=v+'px';$('eChecks').style.fontSize=v+'px';grow()};
const grow=()=>{const b=$('eBody');b.style.height='auto';b.style.height=Math.max(b.scrollHeight,120)+'px'};
const edIcons=()=>{$('ePin').innerHTML=I('pin',cur.pinned);$('ePin').style.color=cur.pinned?'var(--gold)':'';$('eArch').title=cur.arch?'Move out of archive':'Move to archive'};
function openEd(id){cur=id?S.n.find(n=>n.id===id):{id:uid(),title:'',body:'',checks:[],imgs:[],folder:folder,pinned:0,arch:arch?1:0,fs:16,created:Date.now(),updated:Date.now()};cur.checks=cur.checks||[];cur.imgs=cur.imgs||[];$('eTitle').value=cur.title;$('eBody').value=cur.body;$('eFs').value=cur.fs||16;setFs(cur.fs||16);rc();ri();edIcons();$('ed').classList.add('open');grow();if(!id)setTimeout(()=>$('eTitle').focus(),250)}
function closeEd(){$('ed').classList.remove('open');$('pm').classList.remove('open');cur=null}
async function commit(){if(!cur)return;const t=$('eTitle').value.trim(),b=$('eBody').value.trim();cur.checks=cur.checks.filter(c=>c.t.trim());if(!t&&!b&&!cur.checks.length&&!cur.imgs.length){closeEd();return}Object.assign(cur,{title:t,body:b,updated:Date.now()});if(!S.n.includes(cur))S.n.push(cur);await dbPut('notes',cur);closeEd();render();toast('saved')}
function rc(fi){const w=$('eChecks');w.innerHTML='';cur.checks.forEach((c,i)=>{const r=document.createElement('div');r.className='chk-row';r.innerHTML='<div class="todo-check'+(c.d?' done':'')+'">'+I('check')+'</div><input class="chk-in'+(c.d?' done':'')+'" value="'+esc(c.t)+'" placeholder="list item"><button class="icon-btn" aria-label="remove item">'+I('x')+'</button>';const inp=r.querySelector('input');r.querySelector('.todo-check').onclick=()=>{c.d=c.d?0:1;rc()};inp.oninput=()=>{c.t=inp.value};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();cur.checks.splice(i+1,0,{t:'',d:0});rc(i+1)}};r.querySelector('button').onclick=()=>{cur.checks.splice(i,1);rc()};w.appendChild(r);if(i===fi)setTimeout(()=>inp.focus(),0)})}
function ri(){const w=$('eImgs');w.innerHTML='';cur.imgs.forEach(id=>{const d=document.createElement('div');d.className='img-wrap';d.innerHTML='<img alt=""><button class="icon-btn" aria-label="remove photo">'+I('x')+'</button>';w.appendChild(d);dbGet('imgs',id).then(r=>{if(r)d.querySelector('img').src=r.data});d.querySelector('button').onclick=async()=>{cur.imgs=cur.imgs.filter(x=>x!==id);await dbDel('imgs',id);ri()}})}
function shrink(f){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.8))};im.onerror=()=>r(null);im.src=u})}
async function addFiles(fl){let n=0;for(const f of fl){const d=await shrink(f);if(d){const id=uid();await dbPut('imgs',{id,data:d});cur.imgs.push(id);n++}}ri();if(n)toast(n+' photo'+(n>1?'s':'')+' added')}
$('fCam').onchange=$('fImg').onchange=async e=>{await addFiles(e.target.files);e.target.value=''};
$('eBack').onclick=$('eSave').onclick=commit;
$('ePin').onclick=()=>{cur.pinned=cur.pinned?0:1;edIcons()};
$('eFold').onclick=()=>{const L=cur.arch?S.af:S.f;if(!L.length){toast('create a folder first');return}act([['x','No folder',()=>{cur.folder=null;toast('no folder')}],...L.map(f=>['folder',f,()=>{cur.folder=f;toast('folder: '+f)}])])};
$('eArch').onclick=async()=>{cur.arch=cur.arch?0:1;const f=cur.folder;if(f){const L=cur.arch?S.af:S.f;if(!L.includes(f))L.push(f);await saveMeta()}const m=cur.arch?'moved to archive':'moved out of archive';await commit();toast(m)};
$('eDel').onclick=async()=>{if(!cur||!confirm('Delete this note?'))return;const c=cur;S.n=S.n.filter(n=>n!==c);await dbDel('notes',c.id);for(const i of c.imgs)await dbDel('imgs',i);closeEd();render();toast('note deleted')};
$('eBody').oninput=grow;$('eFs').oninput=e=>setFs(e.target.value);
$('ePlus').onclick=()=>$('pm').classList.toggle('open');
$('pCam').onclick=()=>{$('pm').classList.remove('open');$('fCam').click()};
$('pImg').onclick=()=>{$('pm').classList.remove('open');$('fImg').click()};
$('pChk').onclick=()=>{$('pm').classList.remove('open');cur.checks.push({t:'',d:0});rc(cur.checks.length-1)};

async function exp(){const o={v:3,f:S.f,af:S.af,pin:S.pin,todos:S.todos,notes:S.n,imgs:await dbAll('imgs')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='hollow-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('exported')}
$('fImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());for(const [arr,a] of [[o.notes,0],[o.archiveNotes,1]])for(const n of arr||[])if(!S.n.some(x=>x.id===n.id)){const m=Object.assign({checks:[],imgs:[],pinned:0,fs:16,created:Date.now(),updated:Date.now()},n);if(a)m.arch=1;S.n.push(m);await dbPut('notes',m)}for(const i of o.imgs||[])await dbPut('imgs',i);for(const t of [...(o.todos||[]),...(o.archiveTodos||[])])if(!S.todos.some(x=>x.id===t.id))S.todos.push(t);for(const x of o.f||o.folders||[])if(!S.f.includes(x))S.f.push(x);for(const x of o.af||[])if(!S.af.includes(x))S.af.push(x);if(!S.pin&&o.pin)S.pin=o.pin;await saveMeta();render();toast('imported')}catch(err){toast("couldn't read that file")}e.target.value=''};
async function clr(){if(!confirm('Delete EVERYTHING, including the archive? Export first if unsure.'))return;for(const s of ['notes','imgs','meta'])await tx(s,'readwrite',o=>o.clear());S={n:[],f:[],af:[],todos:[],pin:null};arch=0;folder=null;await saveMeta();render();toast('everything cleared')}
$('bMenu').onclick=()=>act([['fplus','New folder',newFolder],['lock',arch?'Leave archive':'Open archive',()=>{if(arch){arch=0;folder=null;render()}else openLock()}],['down','Export backup (.json)',exp],['up','Import backup',()=>$('fImp').click()],['trash','Clear all data',clr,1]]);

let pb='',ps='e',pf='';
const dots=()=>[...$('dots').children].forEach((d,i)=>d.classList.toggle('filled',i<pb.length));
function pad(){const p=$('pad');p.innerHTML='';['1','2','3','4','5','6','7','8','9','','0','b'].forEach(k=>{const b=document.createElement('button');b.className='pin-key'+(k?'':' ghost');if(k==='b')b.innerHTML=I('bksp');else b.textContent=k;if(k)b.onclick=()=>key(k);else b.disabled=true;p.appendChild(b)})}
function key(k){if(k==='b'){pb=pb.slice(0,-1);dots();return}if(pb.length>=4)return;pb+=k;dots();if(pb.length===4)setTimeout(chk,150)}
function chk(){if(!S.pin){if(ps==='s1'){pf=pb;pb='';ps='s2';$('lockSub').textContent='confirm your PIN';dots()}else if(pb===pf){S.pin=pb;saveMeta();unlock()}else{toast("PINs didn't match");pb='';pf='';ps='s1';$('lockSub').textContent='set a new PIN';dots()}}else if(pb===S.pin)unlock();else{toast('wrong PIN');pb='';dots()}}
function openLock(){pb='';pf='';pad();dots();if(!S.pin){ps='s1';$('lockHint').style.display='block';$('lockSub').textContent='set a new PIN'}else{ps='e';$('lockHint').style.display='none';$('lockSub').textContent='enter your PIN'}$('lock').classList.add('open')}
function unlock(){$('lock').classList.remove('open');arch=1;folder=null;render();toast('archive unlocked')}
$('lockBack').onclick=()=>$('lock').classList.remove('open');

async function migrate(){try{const o=JSON.parse(localStorage.getItem('hollow_data_v2')||'null');if(o){S.pin=o.pin||null;S.todos=[...(o.todos||[]),...(o.archiveTodos||[])].map(t=>({id:t.id,text:t.text,done:t.done?1:0,pinned:t.pinned?1:0,created:t.created||Date.now()}));const mk=(n,a)=>({id:n.id,title:n.title||'',body:n.body||'',checks:[],imgs:[],folder:null,pinned:n.pinned?1:0,arch:a,fs:16,created:n.created||Date.now(),updated:n.updated||Date.now()});S.n=[...(o.notes||[]).map(n=>mk(n,0)),...(o.archiveNotes||[]).map(n=>mk(n,1))];for(const n of S.n)await dbPut('notes',n)}}catch(e){}await saveMeta()}
